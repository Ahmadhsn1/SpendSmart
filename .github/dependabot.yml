version: 2

updates:
  # ── Gradle: AndroidX, Material, and the Firebase BOM ──────────────────
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Karachi
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - gradle
    groups:
      # AndroidX and Material move together often enough that separate PRs
      # are just noise.
      androidx-material:
        patterns:
          - "androidx.*"
          - "com.google.android.material:*"
      # The BOM pins every Firebase artifact, so one bump is the whole set.
      firebase:
        patterns:
          - "com.google.firebase:*"
          - "com.google.gms:*"
    ignore:
      # ── Pinned by the current toolchain (compileSdk 34 / AGP 8.2.2) ────
      #
      # AndroidX 1.4+ and Material 1.12+ publish AAR metadata demanding
      # compileSdk 35 and AGP 8.6+, so these bumps fail `checkDebugAarMetadata`
      # rather than merely warning. They are unpinned by the toolchain
      # modernisation tracked in the README roadmap, not one PR at a time.
      - dependency-name: "androidx.appcompat:appcompat"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.recyclerview:recyclerview"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.constraintlayout:constraintlayout"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.android.material:material"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

      # Gradle 9 drops APIs that AGP 8.2.2 still relies on.
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]

      # Major AGP bumps carry breaking Gradle changes and need a deliberate
      # migration, not an automated PR.
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions used by the CI workflow ────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Karachi
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
